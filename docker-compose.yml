services:
  postgres:
    image: postgres:16-alpine
    container_name: gym-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: gym_development
      POSTGRES_USER: gym_user
      POSTGRES_PASSWORD: gym_pass
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gym_user -d gym_development"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
